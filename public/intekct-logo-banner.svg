<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%" fill="none">
  <defs>
    <!-- CT Electric Blue Vertical Gradient matching Logo Mark -->
    <linearGradient id="ctLogoGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#37B8FD" />
      <stop offset="100%" stop-color="#0069F5" />
    </linearGradient>

    <!-- Clip path for rounded icon -->
    <clipPath id="roundedIcon">
      <rect x="50" y="50" width="260" height="260" rx="55" ry="55" />
    </clipPath>
    
    <!-- Subtle drop shadow -->
    <filter id="iconShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Icon Container with Image -->
  <g filter="url(#iconShadow)">
    <image href="/logo.jpg" x="50" y="50" width="260" height="260" preserveAspectRatio="xMidYMid slice" clip-path="url(#roundedIcon)" />
    <rect x="50" y="50" width="260" height="260" rx="55" ry="55" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2" />
  </g>

  <!-- Typography -->
  <g transform="translate(360, 205)">
    <!-- "Intek" in Navy -->
    <text font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="110" fill="#061B36" letter-spacing="-2">Intek<tspan fill="url(#ctLogoGradient)" dx="4">CT</tspan></text>
    
    <!-- "TECHNOLOGIES" in Slate -->
    <text y="58" x="6" font-family="'JetBrains Mono', 'Courier New', monospace" font-weight="700" font-size="34" fill="#64748B" letter-spacing="12">TECHNOLOGIES</text>
  </g>
</svg>
