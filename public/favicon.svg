<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#0099FF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background Shield Container -->
  <rect width="100" height="100" rx="20" fill="#050A18" />
  
  <!-- Outer Glowing Shield Outline -->
  <path d="M50 15 L78 28 V50 C78 68 66 82 50 88 C34 82 22 68 22 50 V28 Z" 
        fill="none" stroke="url(#cyanGlow)" stroke-width="4" stroke-linejoin="round" filter="url(#glow)" />
        
  <!-- Circuit Nodes & Core Lock Symbol -->
  <circle cx="50" cy="45" r="8" fill="url(#cyanGlow)" />
  <path d="M50 53 V68" stroke="#00F2FE" stroke-width="3" stroke-linecap="round" />
  <path d="M38 38 L28 32" stroke="#00F2FE" stroke-width="2.5" stroke-linecap="round" />
  <path d="M62 38 L72 32" stroke="#00F2FE" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="28" cy="32" r="3" fill="#00F2FE" />
  <circle cx="72" cy="32" r="3" fill="#00F2FE" />
  <circle cx="50" cy="68" r="3.5" fill="#00F2FE" />
</svg>
